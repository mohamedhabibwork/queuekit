name: publish

# Tag-driven npm publish for the @queue-kit/* monorepo.
#
# Triggered by release-please pushing a tag of the form
#   @queue-kit/<scope>-v<X.Y.Z>
# e.g. `@queue-kit/core-v0.2.0`, `@queue-kit/memory-v0.1.1`.
#
# Flow:
#   1. parse-tag          — parse the tag into {package-name, dir, version}
#                          and echo them on $GITHUB_STEP_SUMMARY + verify the
#                          package directory exists. (Self-contained — does
#                          NOT depend on outputs from a separate job, which
#                          had cross-job propagation issues on tag pushes.)
#   2. quality            — pnpm install + lint + typecheck + tests + build
#                          (whole workspace, so peer-deps are sound)
#   3. check-version      — tag matches the package's package.json version
#   4. publish            — pnpm publish ONLY the matching package, with
#                          provenance
#   5. github-release     — idempotent guard against release-please having
#                          already created the release
#
# Required secrets:
#   - NPM_TOKEN  — granular token with publish rights on @queue-kit
#                  (Settings -> Secrets and variables -> Actions)

on:
  push:
    tags:
      - '@queue-kit/*-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (e.g. @queue-kit/core). Leave empty for tag-driven mode.'
        required: false
        type: string
      version:
        description: 'Explicit version (e.g. 0.2.0). Leave empty for tag-driven mode.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  parse-tag:
    name: Parse tag and validate workspace
    runs-on: ubuntu-latest
    steps:
      # Checkout is REQUIRED so the DIR existence check below sees
      # packages/<scope>/ on disk. We use the helper to set env vars
      # for downstream jobs (more robust than step.outputs across jobs).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve package from tag
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_PACKAGE" ] && [ -n "$INPUT_VERSION" ]; then
            # workflow_dispatch manual path
            PKG="$INPUT_PACKAGE"
            VER="$INPUT_VERSION"
            DIR="packages/${PKG#@queue-kit/}"
          else
            # tag path: "@queue-kit/<scope>-v<X.Y.Z>"
            TAG="$REF_NAME"
            SCOPE="$(echo "$TAG" | sed -E 's/@queue-kit\/([a-z0-9._-]+)-v[0-9].*/\1/')"
            PKG="@queue-kit/$SCOPE"
            VER="$(echo "$TAG" | sed -E 's/.*-v(.*)/\1/')"
            DIR="packages/$SCOPE"
          fi

          if [ ! -d "$DIR" ]; then
            echo "::error::Resolved package directory does not exist: $DIR"
            exit 1
          fi

          {
            echo "package-name=$PKG"
            echo "package-dir=$DIR"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Publish target"
            echo ""
            echo "- **Package:** \`$PKG\`"
            echo "- **Directory:** \`$DIR/\`"
            echo "- **Version:** \`$VER\`"
            echo "- **Trigger:** \`${REF_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Resolved: $PKG @ $DIR v$VER"

  quality:
    name: Quality gate
    needs: parse-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (unit + contract + type-level)
        run: pnpm test:types

      - name: Build (entire workspace)
        run: pnpm build

      - name: Package checks (publint)
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.package-dir }}
        run: pnpm dlx publint "$PKG_DIR" --strict

  check-version:
    name: Verify tag == package.json version
    needs: parse-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare tag vs package.json
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.package-dir }}
          VERSION: ${{ needs.parse-tag.outputs.version }}
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./${PKG_DIR}/package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "::error::Tag v$VERSION does not match ${PKG_DIR}/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "OK: ${PKG_DIR} @ $PKG_VERSION matches tag v$VERSION"

  publish:
    name: Publish ${{ needs.parse-tag.outputs.package-name }}@${{ needs.parse-tag.outputs.version }}
    needs: [quality, check-version]
    if: >-
      ${{
        !cancelled() &&
        needs.quality.result == 'success' &&
        (needs.check-version.result == 'success' || needs.check-version.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Build matching package
        env:
          PKG_NAME: ${{ needs.parse-tag.outputs.package-name }}
        run: pnpm --filter "$PKG_NAME..." build

      - name: Publish to npm
        env:
          PKG_DIR: ${{ needs.parse-tag.outputs.package-dir }}
          PKG_NAME: ${{ needs.parse-tag.outputs.package-name }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: ${{ needs.parse-tag.outputs.package-dir }}
        run: |
          set -euo pipefail
          # --no-git-checks avoids pnpm's "Git not clean" failure when the
          # tag was just pushed and the local checkout has no matching
          # commit yet.
          pnpm publish --access=public --provenance --no-git-checks

  github-release:
    name: GitHub release (idempotent guard)
    needs: [publish]
    if: >-
      ${{
        !cancelled() &&
        needs.publish.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists (release-please created it); skipping."
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
