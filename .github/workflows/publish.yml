name: publish

# Tag-driven npm publish for the @queue-kit/* monorepo.
#
# Triggered by release-please pushing a tag of the form
#   @queue-kit/<scope>-v<X.Y.Z>
# e.g. `@queue-kit/core-v0.2.0`, `@queue-kit/memory-v0.1.1`.
#
# Each job that needs package information parses the tag inline rather
# than relying on cross-job outputs, which have proven unreliable
# (twice now: missing `outputs:` mapping, then `@`-in-name rendering
# glitch on the publish job's `name:` field).
#
# Flow:
#   1. quality            — pnpm install + lint + typecheck + tests + build
#                          (whole workspace, so peer-deps are sound)
#   2. check-version      — tag matches the package's package.json version
#   3. publish            — pnpm publish ONLY the matching package, with
#                          provenance
#   4. github-release     — idempotent guard against release-please having
#                          already created the release
#
# Required secrets:
#   - NPM_TOKEN  — granular token with publish rights on @queue-kit
#                  (Settings -> Secrets and variables -> Actions)

on:
  push:
    tags:
      - '@queue-kit/*-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish (e.g. @queue-kit/core). Leave empty for tag-driven mode.'
        required: false
        type: string
      version:
        description: 'Explicit version (e.g. 0.2.0). Leave empty for tag-driven mode.'
        required: false
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (unit + contract + type-level)
        run: pnpm test:types

      - name: Build (entire workspace)
        run: pnpm build

  check-version:
    name: Verify tag matches package.json version
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compare tag vs package.json
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_PACKAGE" ] && [ -n "$INPUT_VERSION" ]; then
            PKG="$INPUT_PACKAGE"
            VER="$INPUT_VERSION"
          else
            # tag path: "@queue-kit/<scope>-v<X.Y.Z>"
            TAG="$REF_NAME"
            SCOPE="$(echo "$TAG" | sed -E 's/@queue-kit\/([a-z0-9._-]+)-v[0-9].*/\1/')"
            PKG="@queue-kit/$SCOPE"
            VER="$(echo "$TAG" | sed -E 's/.*-v(.*)/\1/')"
          fi

          DIR="packages/${PKG#@queue-kit/}"
          PKG_VERSION="$(node -p "require('./${DIR}/package.json').version")"
          if [ "$PKG_VERSION" != "$VER" ]; then
            echo "::error::Tag v$VER does not match ${DIR}/package.json version $PKG_VERSION"
            exit 1
          fi
          echo "OK: ${DIR} @ $PKG_VERSION matches tag v$VER"

  publish:
    name: Publish package to npm
    needs: [quality, check-version]
    if: >-
      ${{
        !cancelled() &&
        needs.quality.result == 'success' &&
        needs['check-version'].result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Parse tag and build matching package
        id: parse
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_PACKAGE" ] && [ -n "$INPUT_VERSION" ]; then
            PKG="$INPUT_PACKAGE"
            VER="$INPUT_VERSION"
          else
            # tag path: "@queue-kit/<scope>-v<X.Y.Z>"
            TAG="$REF_NAME"
            SCOPE="$(echo "$TAG" | sed -E 's/@queue-kit\/([a-z0-9._-]+)-v[0-9].*/\1/')"
            PKG="@queue-kit/$SCOPE"
            VER="$(echo "$TAG" | sed -E 's/.*-v(.*)/\1/')"
          fi

          DIR="packages/${PKG#@queue-kit/}"

          if [ ! -d "$DIR" ]; then
            echo "::error::Resolved package directory does not exist: $DIR"
            exit 1
          fi

          {
            echo "package-name=$PKG"
            echo "package-dir=$DIR"
            echo "version=$VER"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Publish target"
            echo ""
            echo "- **Package:** \`$PKG\`"
            echo "- **Directory:** \`$DIR/\`"
            echo "- **Version:** \`$VER\`"
            echo "- **Trigger:** \`$REF_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Resolved: $PKG @ $DIR v$VER"

      - name: Build matching package
        env:
          PKG_NAME: ${{ steps.parse.outputs.package-name }}
        run: pnpm --filter "$PKG_NAME..." build

      - name: "Pre-flight: verify npm scope exists"
        env:
          PKG_NAME: ${{ steps.parse.outputs.package-name }}
        run: |
          set -euo pipefail
          # pnpm publish with --provenance requires the @scope to exist on
          # npm. Without it, the API returns a generic 404 with body
          # "Scope not found" that doesn't tell you to create the org.
          # Probe the registry directly so the failure mode is clear.
          SCOPE="${PKG_NAME#@}"   # @queue-kit/core -> queue-kit/core
          SCOPE="${SCOPE%%/*}"    # queue-kit/core -> queue-kit
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/-/v1/search?text=scope:${SCOPE}&size=1")"
          if [ "$STATUS" != "200" ]; then
            echo "::error::npm registry search failed (HTTP $STATUS). Registry unreachable?"
            exit 1
          fi
          if ! curl -sf "https://registry.npmjs.org/@${SCOPE}" > /dev/null; then
            echo "::error::npm scope @${SCOPE} does not exist on the registry."
            echo "::error::Create the org first: https://www.npmjs.com/org/create"
            echo "::error::(Required once per org. The NPM_TOKEN cannot create scopes.)"
            exit 1
          fi
          echo "OK: scope @${SCOPE} exists on registry.npmjs.org"

      - name: Publish to npm
        env:
          PKG_DIR: ${{ steps.parse.outputs.package-dir }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: ${{ steps.parse.outputs.package-dir }}
        run: |
          set -euo pipefail
          # --no-git-checks avoids pnpm's "Git not clean" failure when the
          # tag was just pushed and the local checkout has no matching
          # commit yet.
          pnpm publish --access=public --provenance --no-git-checks

  github-release:
    name: GitHub release (idempotent guard)
    needs: [publish]
    if: >-
      ${{
        !cancelled() &&
        needs.publish.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists (release-please created it); skipping."
          else
            gh release create "$TAG" --verify-tag --generate-notes
          fi
